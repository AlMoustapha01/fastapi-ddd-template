[build-system]
requires = ["hatchling>=1.13"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/core", "src/modules"]

[project]
name = "fastapi-ddd-template"
version = "0.1.0"
description = "FastAPI boilerplate following Domain-Driven Design, Clean Architecture and CQRS"
readme = "README.md"
authors = [
    { name = "Doumbia Al Moustapha", email = "doumbialmoustapha@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.5",
    "dishka>=1.7.2",
    "fastapi>=0.118.2",
    "psycopg[binary]>=3.2.10",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.43",
    "uuid-utils>=0.11.1",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "ruff>=0.14.0",
    "slotscheck>=0.19.1",
    { include-group = "test" },
]
test = [
    "coverage>=7.10.7",
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if __name__ == .__main__.:",
    '@(abc\.)?abstractmethod',
    '\.\.\.',
]

[tool.coverage.run]
source = ["src"]
omit = ["**/__init__.py"]
concurrency = ["thread"]
parallel = true
branch = true

[tool.mypy]
files = ["src", "tests", "scripts"]
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs Docker (PostgreSQL is started with testcontainers)",
]

[tool.ruff]
line-length = 88
preview = true
src = ["src", "."]

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "A", "ARG", "ASYNC", "B", "C4", "C90", "DTZ", "E", "ERA001", "F", "FLY", "I",
    "LOG", "N", "PERF", "PL", "PT", "PTH", "Q", "RET", "RSE", "RUF", "S", "SIM",
    "SLF", "SLOT", "T20", "TCH", "TID", "UP", "W",
]
ignore = [
    "N818",    # error-suffix-on-exception-name
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR6301", # no-self-use
    "PTH123",  # builtin-open
    "RUF029",  # unused-async: endpoints and port implementations may not await
    "TC001",   # typing-only-first-party-import
    "TC002",   # typing-only-third-party-import
    "TC003",   # typing-only-standard-library-import
    "TC006",   # runtime-cast-value
    "UP015",   # redundant-open-modes
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/**" = ["ALL"]
"scripts/**" = ["T201"]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
split-on-trailing-comma = true

[tool.slotscheck]
strict-imports = false
