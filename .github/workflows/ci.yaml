name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Check code
        run: uv run make code.check

      - name: Test Docker Compose setup
        env:
          APP_ENV: local
        run: |
          uv run config/toml_config_manager.py
          cd config/local
          docker compose --env-file .env.local up -d --build

      - name: Wait for services to be ready
        run: |
          echo "Waiting for database to be ready..."
          cd config/local
          export APP_ENV=local
          docker compose --env-file .env.local logs -f web_app_db_pg &
          LOGS_PID=$!

          # Wait for database
          timeout 30s bash -c 'until docker compose --env-file .env.local exec -T web_app_db_pg pg_isready -U postgres; do sleep 1; done'

          echo "Database is ready. Checking application logs..."
          docker compose --env-file .env.local logs web_app

          kill $LOGS_PID 2>/dev/null || true

      - name: Verify Application Health
        run: |
          echo "Waiting for application to be healthy..."
          timeout 60s bash -s <<'BASH'
          export APP_ENV=local
          while ! curl -sf http://127.0.0.1:8000/api/v1/health; do
            echo "Waiting for health endpoint..."
            sleep 2
          done
          echo "Application is healthy!"
          BASH

      - name: Test Get All Sections Endpoint
        run: |
          curl -f -X GET "http://127.0.0.1:8000/api/v1/sections/?page=1&limit=10" \
            -H "accept: application/json"

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Application Logs ==="
          cd config/local
          export APP_ENV=local
          docker compose --env-file .env.local logs web_app
          echo "=== Database Logs ==="
          docker compose --env-file .env.local logs web_app_db_pg

      - name: Cleanup
        if: always()
        run: |
          cd config/local
          export APP_ENV=local
          docker compose --env-file .env.local down -v
