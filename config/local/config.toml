# APP
[app]
NAME="Equation Prepaid Backend"
PROJECT_DESCRIPTION="Backend API for Equation Prepaid system with rules management"
VERSION="1.0.0"

# PostgreSQL
[postgres]
DB = "eq_prepaid_db"
HOST = "127.0.0.1"
PORT = 5432
DRIVER = "psycopg"

# Uvicorn
[uvicorn]
HOST = "0.0.0.0"
PORT = 8000

# SQLAlchemy
[sqla]
ECHO = false
ECHO_POOL = false
POOL_SIZE = 50
MAX_OVERFLOW = 10

# Keycloak DB (internal Postgres service keycloak-postgres)
[kc]
DB="postgres"
DB_NAME="keycloak"
DB_URL="jdbc:postgresql://keycloak-postgres:5432/keycloak"
HOSTNAME="localhost"
PORT=8088
PORT_SECURED=8443
DB_PORT=5433

# Keycloak OAuth2 Configuration
[kc_app]
SERVER_URL="http://keycloak:8080"
REALM="eq_prepaid_realm"
CLIENT_ID="eq_prepaid_backend_cli"
AUTHORIZATION_ENDPOINT="/protocol/openid-connect/auth"
TOKEN_ENDPOINT="/protocol/openid-connect/token"
USERINFO_ENDPOINT="/protocol/openid-connect/userinfo"
JWKS_ENDPOINT="/protocol/openid-connect/certs"
LOGOUT_ENDPOINT="/protocol/openid-connect/logout"
SCOPES="openid profile email"

# Logs
[logs]
# Can be set to "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"
LEVEL = "DEBUG"

[security.cookies]
# Choose `true` for production (secure=True, samesite="Strict")
SECURE = false

